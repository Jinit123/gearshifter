name: Gear Shifter CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with: 
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Check backend
        working-directory: Backend
        run: npm ci 

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps: 
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with: 
        node-version: 22
        cache: npm
        cache-dependency-path: Frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: Frontend
      run: npm ci

    - name: Build frontend
      working-directory: Frontend
      env:
        VITE_BACKEND_URL: http://localhost:5000
      run: npm run build

  docker: 
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with: 
          context: ./Backend
          push: true
          tags: jinitmewada/gear-shifter-backend:latest

      - name: Bulid and push frontend image
        uses: docker/build-push-action@v6
        with: 
          context: ./Frontend
          push: true
          tags: jinitmewada/gear-shifter-frontend:latest
          build-args: |
            VITE_BACKEND_URL=https://gear-shifter-backend.onrender.com     
